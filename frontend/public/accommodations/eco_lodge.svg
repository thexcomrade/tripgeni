<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="el-border" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="50%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#34D399"/>
    </linearGradient>
    <linearGradient id="el-sky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#022C22"/>
      <stop offset="40%" stop-color="#064E3B"/>
      <stop offset="80%" stop-color="#047857"/>
      <stop offset="100%" stop-color="#A7F3D0"/>
    </linearGradient>
    <linearGradient id="el-wood" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#78350F"/>
      <stop offset="50%" stop-color="#9A3412"/>
      <stop offset="100%" stop-color="#78350F"/>
    </linearGradient>
    <clipPath id="el-clip">
      <rect x="28" y="28" width="456" height="456" rx="104" ry="104"/>
    </clipPath>
  </defs>

  <g clip-path="url(#el-clip)">
    <!-- Pristine Rainforest Sky -->
    <rect x="28" y="28" width="456" height="456" fill="url(#el-sky)"/>

    <!-- Soft Morning Jungle Mist Sun -->
    <circle cx="256" cy="150" r="50" fill="#ECFDF5" opacity="0.8"/>

    <!-- Dense Jungle Canopy Layers -->
    <path d="M28 220 Q90 160 160 200 Q240 150 320 190 Q400 140 484 210 L484 484 L28 484 Z" fill="#022C22" opacity="0.85"/>
    <path d="M28 260 Q120 200 220 240 Q310 190 410 230 Q450 210 484 250 L484 484 L28 484 Z" fill="#064E3B"/>

    <!-- SUSTAINABLE TIMBER ECO LODGE ON STILTS -->
    <!-- Supporting Heavy Timber Stilts -->
    <g stroke="#451A03" stroke-width="7" stroke-linecap="round">
      <line x1="160" y1="290" x2="160" y2="420"/>
      <line x1="210" y1="290" x2="210" y2="420"/>
      <line x1="302" y1="290" x2="302" y2="420"/>
      <line x1="352" y1="290" x2="352" y2="420"/>
      <!-- Diagonal bracing struts -->
      <line x1="160" y1="360" x2="210" y2="300" stroke-width="4"/>
      <line x1="210" y1="360" x2="160" y2="300" stroke-width="4"/>
      <line x1="302" y1="360" x2="352" y2="300" stroke-width="4"/>
      <line x1="352" y1="360" x2="302" y2="300" stroke-width="4"/>
    </g>

    <!-- Slanted Eco Living Roof / Solar Panels -->
    <polygon points="120,170 392,130 380,185 130,225" fill="#047857"/>
    <!-- Solar panel cells matrix -->
    <g fill="#0284C7" stroke="#38BDF8" stroke-width="1.5">
      <polygon points="145,178 195,170 190,195 140,203"/>
      <polygon points="205,168 255,160 250,185 200,193"/>
      <polygon points="265,158 315,150 310,175 260,183"/>
      <polygon points="325,148 375,140 370,165 320,173"/>
    </g>

    <!-- Lodge Wooden Cabin Body -->
    <polygon points="140,210 372,175 372,290 140,290" fill="url(#el-wood)"/>
    <!-- Horizontal Timber Logs -->
    <g stroke="#451A03" stroke-width="2">
      <line x1="140" y1="230" x2="372" y2="230"/>
      <line x1="140" y1="250" x2="372" y2="250"/>
      <line x1="140" y1="270" x2="372" y2="270"/>
    </g>

    <!-- Bamboo Balcony Observation Deck -->
    <rect x="130" y="285" width="252" height="15" rx="3" fill="#B45309"/>
    <!-- Bamboo Railing -->
    <rect x="135" y="260" width="242" height="6" rx="2" fill="#D97706"/>
    <g stroke="#92400E" stroke-width="2.5">
      <line x1="150" y1="260" x2="150" y2="285"/>
      <line x1="175" y1="260" x2="175" y2="285"/>
      <line x1="200" y1="260" x2="200" y2="285"/>
      <line x1="310" y1="260" x2="310" y2="285"/>
      <line x1="335" y1="260" x2="335" y2="285"/>
      <line x1="360" y1="260" x2="360" y2="285"/>
    </g>

    <!-- Warm Glowing Windows & Lantern -->
    <rect x="220" y="215" width="34" height="40" rx="3" fill="#FEF08A" stroke="#451A03" stroke-width="2"/>
    <line x1="237" y1="215" x2="237" y2="255" stroke="#451A03" stroke-width="1.5"/>
    <line x1="220" y1="235" x2="254" y2="235" stroke="#451A03" stroke-width="1.5"/>

    <rect x="268" y="210" width="34" height="40" rx="3" fill="#FEF08A" stroke="#451A03" stroke-width="2"/>
    <line x1="285" y1="210" x2="285" y2="250" stroke="#451A03" stroke-width="1.5"/>
    <line x1="268" y1="230" x2="302" y2="230" stroke="#451A03" stroke-width="1.5"/>

    <!-- Hanging Solar Lantern -->
    <circle cx="150" cy="275" r="5" fill="#FDE047"/>

    <!-- Crystal Clear Rainforest Stream flowing below -->
    <path d="M28 410 Q140 380 256 410 Q370 440 484 410 L484 484 L28 484 Z" fill="#0D9488"/>
    <path d="M28 440 Q150 410 260 435 Q380 460 484 435 L484 484 L28 484 Z" fill="#14B8A6"/>
    <!-- River stream rippling lines -->
    <line x1="60" y1="455" x2="160" y2="445" stroke="#CCFBF1" stroke-width="3" stroke-linecap="round"/>
    <line x1="200" y1="465" x2="320" y2="455" stroke="#CCFBF1" stroke-width="3" stroke-linecap="round"/>
    <line x1="360" y1="450" x2="450" y2="440" stroke="#CCFBF1" stroke-width="3" stroke-linecap="round"/>

    <!-- Lush Monstera & Fern Foliage in Foreground -->
    <g transform="translate(30, 360)">
      <path d="M10 110 Q50 30 110 50 Q60 80 10 110 Z" fill="#047857"/>
      <path d="M10 110 Q20 20 70 30 Q40 70 10 110 Z" fill="#059669"/>
      <path d="M10 110 Q-20 40 20 20 Q10 70 10 110 Z" fill="#10B981"/>
    </g>
    <g transform="translate(390, 360)">
      <path d="M90 110 Q50 30 -10 50 Q40 80 90 110 Z" fill="#047857"/>
      <path d="M90 110 Q80 20 30 30 Q60 70 90 110 Z" fill="#059669"/>
    </g>

    <!-- Eco Leaf / Sustainability Emblem (Upper Left) -->
    <g transform="translate(64, 64)">
      <circle cx="28" cy="28" r="24" fill="rgba(15, 23, 42, 0.75)" stroke="#10B981" stroke-width="2"/>
      <path d="M18 36 Q16 18 38 18 Q38 38 18 36 Z" fill="#10B981"/>
      <line x1="18" y1="36" x2="32" y2="24" stroke="#A7F3D0" stroke-width="1.8"/>
    </g>

    <rect x="28" y="28" width="456" height="456" rx="104" ry="104" fill="none" stroke="rgba(255, 255, 255, 0.12)" stroke-width="1.5"/>
  </g>

  <rect x="28" y="28" width="456" height="456" rx="104" ry="104" fill="none" stroke="url(#el-border)" stroke-width="7"/>
</svg>