<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="rs-border" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06B6D4"/>
      <stop offset="50%" stop-color="#14B8A6"/>
      <stop offset="100%" stop-color="#10B981"/>
    </linearGradient>
    <linearGradient id="rs-sky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0369A1"/>
      <stop offset="35%" stop-color="#38BDF8"/>
      <stop offset="70%" stop-color="#BAE6FD"/>
      <stop offset="100%" stop-color="#FED7AA"/>
    </linearGradient>
    <linearGradient id="rs-pool" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#22D3EE"/>
      <stop offset="50%" stop-color="#06B6D4"/>
      <stop offset="100%" stop-color="#0891B2"/>
    </linearGradient>
    <linearGradient id="rs-deck" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#78350F"/>
      <stop offset="50%" stop-color="#9A3412"/>
      <stop offset="100%" stop-color="#78350F"/>
    </linearGradient>
    <clipPath id="rs-clip">
      <rect x="28" y="28" width="456" height="456" rx="104" ry="104"/>
    </clipPath>
  </defs>

  <g clip-path="url(#rs-clip)">
    <!-- Azure Sunset Sky -->
    <rect x="28" y="28" width="456" height="456" fill="url(#rs-sky)"/>

    <!-- Tropical Golden Sun sinking into ocean horizon -->
    <circle cx="256" cy="225" r="48" fill="#FDE047" opacity="0.9"/>
    <!-- Distant Ocean & Island Silhouettes -->
    <rect x="28" y="225" width="456" height="40" fill="#0284C7"/>
    <path d="M70 225 Q120 205 170 225 Z" fill="#0C4A6E" opacity="0.7"/>
    <path d="M340 225 Q390 208 440 225 Z" fill="#0C4A6E" opacity="0.7"/>

    <!-- LUXURY RESORT VILLA -->
    <!-- Villa Roof (Pitched Tropical Stucco) -->
    <polygon points="120,175 256,120 392,175" fill="#451A03"/>
    <polygon points="132,175 256,128 380,175" fill="#78350F"/>
    <!-- Villa Body -->
    <rect x="140" y="175" width="232" height="90" fill="#F8FAFC"/>
    <!-- Glass Sliding Doors (showing ocean view & warm glow) -->
    <rect x="156" y="185" width="60" height="78" rx="2" fill="#FEF08A" opacity="0.85"/>
    <rect x="226" y="185" width="60" height="78" rx="2" fill="#38BDF8" opacity="0.75"/>
    <rect x="296" y="185" width="60" height="78" rx="2" fill="#FEF08A" opacity="0.85"/>
    <line x1="186" y1="185" x2="186" y2="263" stroke="#0F172A" stroke-width="2"/>
    <line x1="256" y1="185" x2="256" y2="263" stroke="#0F172A" stroke-width="2"/>
    <line x1="326" y1="185" x2="326" y2="263" stroke="#0F172A" stroke-width="2"/>

    <!-- Teak Sun Deck -->
    <polygon points="60,265 452,265 484,335 28,335" fill="url(#rs-deck)"/>
    <!-- Deck plank grooves -->
    <line x1="80" y1="280" x2="432" y2="280" stroke="#451A03" stroke-width="1.5"/>
    <line x1="60" y1="300" x2="452" y2="300" stroke="#451A03" stroke-width="1.5"/>
    <line x1="40" y1="320" x2="472" y2="320" stroke="#451A03" stroke-width="1.5"/>

    <!-- TURQUOISE INFINITY POOL -->
    <path d="M28 335 L484 335 L484 484 L28 484 Z" fill="url(#rs-pool)"/>
    <!-- Infinity pool water reflections / light caustic lines -->
    <path d="M60 365 Q160 350 256 365 Q360 380 450 360" stroke="#E0F2FE" stroke-width="3" fill="none" opacity="0.6"/>
    <path d="M40 400 Q150 385 270 405 Q380 420 470 395" stroke="#E0F2FE" stroke-width="2.5" fill="none" opacity="0.5"/>
    <path d="M50 445 Q160 430 256 448 Q370 465 460 440" stroke="#E0F2FE" stroke-width="2" fill="none" opacity="0.4"/>

    <!-- Sun Loungers on Deck -->
    <g transform="translate(110, 275)">
      <!-- Lounger 1 -->
      <polygon points="0,20 12,5 40,5 50,20" fill="#F8FAFC"/>
      <line x1="5" y1="20" x2="5" y2="28" stroke="#94A3B8" stroke-width="2"/>
      <line x1="45" y1="20" x2="45" y2="28" stroke="#94A3B8" stroke-width="2"/>
      <rect x="10" y="3" width="12" height="6" rx="2" fill="#0EA5E9"/>
    </g>

    <!-- Striped Cabana Pool Umbrella -->
    <g transform="translate(80, 215)">
      <line x1="45" y1="50" x2="45" y2="90" stroke="#E2E8F0" stroke-width="3"/>
      <!-- Umbrella Canopy -->
      <path d="M10 50 Q45 20 80 50 Z" fill="#0284C7"/>
      <path d="M25 45 Q45 22 65 45 Z" fill="#F8FAFC"/>
      <path d="M38 38 Q45 23 52 38 Z" fill="#0284C7"/>
    </g>

    <!-- Elegant Tropical Palm Tree contained on right edge -->
    <g transform="translate(390, 110)">
      <!-- Curved Trunk -->
      <path d="M35 190 Q60 110 30 50 Q24 40 20 38 Q25 45 40 110 Q50 160 45 190 Z" fill="#78350F"/>
      <!-- Palm Fronds -->
      <path d="M20 38 Q-30 20 -70 50 Q-20 35 20 38 Z" fill="#047857"/>
      <path d="M20 38 Q-10 -15 -35 -35 Q-5 -5 20 38 Z" fill="#059669"/>
      <path d="M20 38 Q40 -20 60 -40 Q40 0 20 38 Z" fill="#10B981"/>
      <path d="M20 38 Q70 10 90 25 Q55 25 20 38 Z" fill="#047857"/>
      <path d="M20 38 Q50 60 70 90 Q40 60 20 38 Z" fill="#059669"/>
    </g>

    <!-- Tropical Cocktail / Coconut Drink Floating Badge (Upper Left) -->
    <g transform="translate(64, 64)">
      <circle cx="28" cy="28" r="24" fill="rgba(15, 23, 42, 0.75)" stroke="#06B6D4" stroke-width="2"/>
      <!-- Cocktail Glass & Palm Straw -->
      <path d="M18 20 L38 20 L28 34 Z" fill="#22D3EE"/>
      <line x1="28" y1="34" x2="28" y2="44" stroke="#F8FAFC" stroke-width="2"/>
      <line x1="22" y1="44" x2="34" y2="44" stroke="#F8FAFC" stroke-width="2"/>
      <!-- Small lime wedge -->
      <path d="M34 16 A6 6 0 0 1 40 22 Z" fill="#84CC16"/>
    </g>

    <rect x="28" y="28" width="456" height="456" rx="104" ry="104" fill="none" stroke="rgba(255, 255, 255, 0.12)" stroke-width="1.5"/>
  </g>

  <rect x="28" y="28" width="456" height="456" rx="104" ry="104" fill="none" stroke="url(#rs-border)" stroke-width="7"/>
</svg>