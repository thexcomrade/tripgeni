<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="hs-border" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="50%" stop-color="#84CC16"/>
      <stop offset="100%" stop-color="#EAB308"/>
    </linearGradient>
    <linearGradient id="hs-sky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#064E3B"/>
      <stop offset="35%" stop-color="#047857"/>
      <stop offset="70%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#FEF08A"/>
    </linearGradient>
    <linearGradient id="hs-roof" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#991B1B"/>
      <stop offset="50%" stop-color="#DC2626"/>
      <stop offset="100%" stop-color="#991B1B"/>
    </linearGradient>
    <linearGradient id="hs-wall" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FEF3C7"/>
      <stop offset="100%" stop-color="#FDE68A"/>
    </linearGradient>
    <clipPath id="hs-clip">
      <rect x="28" y="28" width="456" height="456" rx="104" ry="104"/>
    </clipPath>
  </defs>

  <g clip-path="url(#hs-clip)">
    <!-- Golden Countryside Sky -->
    <rect x="28" y="28" width="456" height="456" fill="url(#hs-sky)"/>

    <!-- Warm Golden Sunset -->
    <circle cx="340" cy="180" r="46" fill="#FFFBEB" opacity="0.9"/>

    <!-- Layered Rolling Pastoral Hills -->
    <path d="M28 250 Q140 200 280 230 Q390 210 484 240 L484 484 L28 484 Z" fill="#065F46"/>
    <path d="M28 285 Q160 245 310 270 Q410 250 484 280 L484 484 L28 484 Z" fill="#047857"/>
    <path d="M28 330 Q180 295 330 325 Q420 300 484 330 L484 484 L28 484 Z" fill="#10B981"/>

    <!-- CHARMING TRADITIONAL HOMESTAY COTTAGE -->
    <!-- Stone Chimney & Smoke -->
    <rect x="180" y="145" width="24" height="55" rx="3" fill="#64748B"/>
    <!-- Chimney smoke spirals -->
    <path d="M192 145 Q180 125 195 105 Q210 85 195 65 Q180 45 200 30" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" fill="none" opacity="0.55"/>

    <!-- Terracotta Clay Pitched Roof -->
    <polygon points="140,200 256,135 372,200" fill="url(#hs-roof)"/>
    <!-- Roof tiles lines -->
    <line x1="160" y1="188" x2="352" y2="188" stroke="#7F1D1D" stroke-width="2"/>
    <line x1="180" y1="176" x2="332" y2="176" stroke="#7F1D1D" stroke-width="2"/>
    <line x1="205" y1="162" x2="307" y2="162" stroke="#7F1D1D" stroke-width="2"/>

    <!-- Cottage Body -->
    <rect x="156" y="200" width="200" height="110" fill="url(#hs-wall)"/>
    <!-- Timber framing accents -->
    <line x1="156" y1="200" x2="156" y2="310" stroke="#78350F" stroke-width="4"/>
    <line x1="356" y1="200" x2="356" y2="310" stroke="#78350F" stroke-width="4"/>
    <line x1="156" y1="310" x2="356" y2="310" stroke="#78350F" stroke-width="4"/>

    <!-- Cozy Multi-Pane Windows glowing with warm light -->
    <g transform="translate(175, 215)">
      <rect x="0" y="0" width="38" height="42" rx="3" fill="#FEF08A" stroke="#78350F" stroke-width="2.5"/>
      <line x1="19" y1="0" x2="19" y2="42" stroke="#78350F" stroke-width="2"/>
      <line x1="0" y1="21" x2="38" y2="21" stroke="#78350F" stroke-width="2"/>
      <!-- Window flower box -->
      <rect x="-3" y="40" width="44" height="8" rx="2" fill="#B45309"/>
      <circle cx="4" cy="40" r="3.5" fill="#EF4444"/>
      <circle cx="16" cy="40" r="3.5" fill="#EC4899"/>
      <circle cx="28" cy="40" r="3.5" fill="#FACC15"/>
      <circle cx="38" cy="40" r="3.5" fill="#EF4444"/>
    </g>

    <g transform="translate(299, 215)">
      <rect x="0" y="0" width="38" height="42" rx="3" fill="#FEF08A" stroke="#78350F" stroke-width="2.5"/>
      <line x1="19" y1="0" x2="19" y2="42" stroke="#78350F" stroke-width="2"/>
      <line x1="0" y1="21" x2="38" y2="21" stroke="#78350F" stroke-width="2"/>
      <!-- Window flower box -->
      <rect x="-3" y="40" width="44" height="8" rx="2" fill="#B45309"/>
      <circle cx="4" cy="40" r="3.5" fill="#FACC15"/>
      <circle cx="16" cy="40" r="3.5" fill="#EF4444"/>
      <circle cx="28" cy="40" r="3.5" fill="#EC4899"/>
      <circle cx="38" cy="40" r="3.5" fill="#FACC15"/>
    </g>

    <!-- Warm Timber Front Door -->
    <g transform="translate(235, 220)">
      <rect x="0" y="0" width="42" height="90" rx="3" fill="#78350F"/>
      <!-- Door Panels -->
      <rect x="5" y="8" width="32" height="32" rx="2" fill="#9A3412"/>
      <rect x="5" y="48" width="32" height="36" rx="2" fill="#9A3412"/>
      <!-- Brass Door Knob -->
      <circle cx="32" cy="45" r="3" fill="#FBBF24"/>
      <!-- Porch Lantern -->
      <circle cx="21" cy="-8" r="5" fill="#FDE047"/>
    </g>

    <!-- Stone Flagstone Pathway winding to foreground -->
    <polygon points="230,310 282,310 320,484 192,484" fill="#94A3B8"/>
    <!-- Stones -->
    <g fill="#CBD5E1">
      <ellipse cx="256" cy="330" rx="16" ry="6"/>
      <ellipse cx="245" cy="355" rx="22" ry="8"/>
      <ellipse cx="268" cy="385" rx="28" ry="10"/>
      <ellipse cx="250" cy="425" rx="34" ry="12"/>
      <ellipse cx="270" cy="465" rx="42" ry="14"/>
    </g>

    <!-- Cottage Garden & Wildflowers -->
    <rect x="28" y="380" width="164" height="104" fill="#15803D"/>
    <rect x="320" y="380" width="164" height="104" fill="#15803D"/>
    <!-- Flower Blossoms -->
    <g fill="#FACC15">
      <circle cx="100" cy="410" r="6"/>
      <circle cx="140" cy="435" r="7"/>
      <circle cx="370" cy="420" r="6"/>
      <circle cx="420" cy="445" r="8"/>
    </g>
    <g fill="#EF4444">
      <circle cx="80" cy="435" r="6"/>
      <circle cx="125" cy="405" r="7"/>
      <circle cx="390" cy="435" r="7"/>
      <circle cx="350" cy="410" r="6"/>
    </g>

    <!-- Rustic Wooden Picket Fence -->
    <g stroke="#78350F" stroke-width="4">
      <line x1="80" y1="360" x2="220" y2="360"/>
      <line x1="292" y1="360" x2="432" y2="360"/>
    </g>
    <g fill="#9A3412">
      <polygon points="90,340 96,332 102,340 102,380 90,380"/>
      <polygon points="130,340 136,332 142,340 142,380 130,380"/>
      <polygon points="170,340 176,332 182,340 182,380 170,380"/>
      <polygon points="210,340 216,332 222,340 222,380 210,380"/>
      <polygon points="300,340 306,332 312,340 312,380 300,380"/>
      <polygon points="340,340 346,332 352,340 352,380 340,380"/>
      <polygon points="380,340 386,332 392,340 392,380 380,380"/>
      <polygon points="420,340 426,332 432,340 432,380 420,380"/>
    </g>

    <!-- Heart Heritage Emblem (Upper Left) -->
    <g transform="translate(64, 64)">
      <circle cx="28" cy="28" r="24" fill="rgba(15, 23, 42, 0.75)" stroke="#10B981" stroke-width="2"/>
      <path d="M28 38 Q18 28 16 20 A7 7 0 0 1 28 16 A7 7 0 0 1 40 20 Q38 28 28 38 Z" fill="#EF4444"/>
    </g>

    <rect x="28" y="28" width="456" height="456" rx="104" ry="104" fill="none" stroke="rgba(255, 255, 255, 0.12)" stroke-width="1.5"/>
  </g>

  <rect x="28" y="28" width="456" height="456" rx="104" ry="104" fill="none" stroke="url(#hs-border)" stroke-width="7"/>
</svg>