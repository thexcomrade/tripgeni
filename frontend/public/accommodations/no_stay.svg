<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="ns-border" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="50%" stop-color="#0284C7"/>
      <stop offset="100%" stop-color="#6366F1"/>
    </linearGradient>
    <linearGradient id="ns-sky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="40%" stop-color="#1E293B"/>
      <stop offset="70%" stop-color="#B45309"/>
      <stop offset="90%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#FDE68A"/>
    </linearGradient>
    <radialGradient id="ns-sun" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="35%" stop-color="#FEF08A"/>
      <stop offset="70%" stop-color="#F59E0B" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#F59E0B" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ns-road" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="ns-mountain1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#312E81"/>
      <stop offset="100%" stop-color="#1E1B4B"/>
    </linearGradient>
    <linearGradient id="ns-mountain2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <clipPath id="ns-clip">
      <rect x="28" y="28" width="456" height="456" rx="104" ry="104"/>
    </clipPath>
  </defs>

  <!-- BACKGROUND BASE & CLIPPED SCENE -->
  <g clip-path="url(#ns-clip)">
    <!-- Sky -->
    <rect x="28" y="28" width="456" height="456" fill="url(#ns-sky)"/>

    <!-- Radiant Sunrise -->
    <circle cx="256" cy="220" r="110" fill="url(#ns-sun)"/>
    <circle cx="256" cy="220" r="46" fill="#FFFBEB"/>

    <!-- Sun rays -->
    <g stroke="#FEF08A" stroke-width="2.5" opacity="0.35">
      <line x1="256" y1="120" x2="256" y2="80"/>
      <line x1="180" y1="144" x2="150" y2="114"/>
      <line x1="332" y1="144" x2="362" y2="114"/>
      <line x1="150" y1="220" x2="110" y2="220"/>
      <line x1="362" y1="220" x2="402" y2="220"/>
    </g>

    <!-- Distant Mountain Ranges -->
    <path d="M28 290 L110 215 L190 260 L280 185 L380 255 L484 210 L484 350 L28 350 Z" fill="url(#ns-mountain1)" opacity="0.85"/>
    <path d="M28 310 L95 250 L180 295 L256 235 L340 280 L420 240 L484 275 L484 380 L28 380 Z" fill="url(#ns-mountain2)"/>

    <!-- Coastal Hills & Greenery -->
    <path d="M28 340 Q130 310 240 330 Q360 300 484 335 L484 484 L28 484 Z" fill="#064E3B"/>
    <path d="M28 365 Q150 330 256 350 Q380 320 484 360 L484 484 L28 484 Z" fill="#047857"/>

    <!-- Panoramic Highway in Perspective -->
    <path d="M256 315 L220 484 L292 484 Z" fill="url(#ns-road)"/>
    <!-- Road curves & shoulders -->
    <path d="M256 315 L160 484 L220 484 Z" fill="#64748B" opacity="0.4"/>
    <path d="M256 315 L292 484 L352 484 Z" fill="#64748B" opacity="0.4"/>
    <!-- Yellow Center Dashed Lines -->
    <line x1="256" y1="325" x2="256" y2="345" stroke="#FBBF24" stroke-width="2.5"/>
    <line x1="256" y1="360" x2="256" y2="390" stroke="#FBBF24" stroke-width="4"/>
    <line x1="256" y1="410" x2="256" y2="455" stroke="#FBBF24" stroke-width="6"/>

    <!-- Silhouetted Pine / Cypress Trees along roadside -->
    <path d="M120 370 L130 330 L140 370 Z M124 350 L130 320 L136 350 Z" fill="#022C22"/>
    <path d="M142 385 L150 345 L158 385 Z" fill="#022C22"/>
    <path d="M365 375 L375 335 L385 375 Z" fill="#022C22"/>
    <path d="M382 390 L390 350 L398 390 Z" fill="#022C22"/>

    <!-- Hero Roadster / Day-Trip Car (Rear Perspective cruising forward) -->
    <g transform="translate(226, 385)">
      <!-- Car shadow -->
      <ellipse cx="30" cy="54" rx="34" ry="7" fill="#000000" opacity="0.6"/>
      <!-- Car Body -->
      <path d="M8 32 Q14 18 30 18 Q46 18 52 32 L56 46 Q56 50 50 50 L10 50 Q4 50 4 46 Z" fill="#0284C7"/>
      <!-- Convertible Cockpit & Windshield -->
      <path d="M14 28 Q30 14 46 28 Z" fill="#38BDF8" opacity="0.9"/>
      <!-- Headrests / Travelers -->
      <circle cx="23" cy="22" r="4.5" fill="#F8FAFC"/>
      <circle cx="37" cy="22" r="4.5" fill="#F8FAFC"/>
      <!-- Red Taillights -->
      <rect x="8" y="38" width="10" height="4" rx="2" fill="#EF4444"/>
      <rect x="42" y="38" width="10" height="4" rx="2" fill="#EF4444"/>
      <!-- License Plate -->
      <rect x="24" y="40" width="12" height="6" rx="1.5" fill="#F8FAFC"/>
      <!-- Wheels -->
      <rect x="2" y="38" width="5" height="12" rx="2" fill="#0F172A"/>
      <rect x="53" y="38" width="5" height="12" rx="2" fill="#0F172A"/>
    </g>

    <!-- Modern Compass Rose Floating Badge (Upper Left) -->
    <g transform="translate(62, 62)">
      <circle cx="28" cy="28" r="24" fill="rgba(15, 23, 42, 0.75)" stroke="#38BDF8" stroke-width="2"/>
      <!-- Star needle -->
      <polygon points="28,8 33,25 28,28" fill="#38BDF8"/>
      <polygon points="28,8 23,25 28,28" fill="#BAE6FD"/>
      <polygon points="28,48 33,31 28,28" fill="#64748B"/>
      <polygon points="28,48 23,31 28,28" fill="#94A3B8"/>
      <polygon points="8,28 25,23 28,28" fill="#64748B"/>
      <polygon points="48,28 31,23 28,28" fill="#38BDF8"/>
      <circle cx="28" cy="28" r="3.5" fill="#F8FAFC"/>
    </g>

    <!-- Internal Ambient Border Vignette -->
    <rect x="28" y="28" width="456" height="456" rx="104" ry="104" fill="none" stroke="rgba(255, 255, 255, 0.12)" stroke-width="1.5"/>
  </g>

  <!-- OUTER SQUIRCLE FRAME -->
  <rect x="28" y="28" width="456" height="456" rx="104" ry="104" fill="none" stroke="url(#ns-border)" stroke-width="7"/>
</svg>