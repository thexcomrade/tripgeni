<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="pt-bg" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>
    <linearGradient id="pt-plane" x1="16" y1="16" x2="48" y2="48" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#E2E8F0"/>
    </linearGradient>
    <linearGradient id="pt-wing" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F43F5E"/>
      <stop offset="100%" stop-color="#BE123C"/>
    </linearGradient>
    <linearGradient id="pt-trail" x1="10" y1="45" x2="35" y2="28" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FDE047" stop-opacity="0"/>
      <stop offset="100%" stop-color="#FDE047" stop-opacity="0.9"/>
    </linearGradient>
    <filter id="pt-glow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#0284C7" flood-opacity="0.4"/>
    </filter>
  </defs>
  <!-- Background Badge -->
  <circle cx="32" cy="32" r="30" fill="url(#pt-bg)" filter="url(#pt-glow)"/>
  <circle cx="32" cy="32" r="28" stroke="#7DD3FC" stroke-width="1.5" stroke-dasharray="3 2" opacity="0.6"/>
  <!-- Jet Motion Trail -->
  <path d="M12 48 C 18 44, 25 38, 33 30" stroke="url(#pt-trail)" stroke-width="3" stroke-linecap="round"/>
  <path d="M10 52 C 16 48, 22 42, 28 36" stroke="#FEF08A" stroke-width="1.8" stroke-linecap="round" opacity="0.8"/>
  <!-- Cartoon Jet / Plane -->
  <g transform="translate(4, -2)">
    <!-- Main Fuselage -->
    <path d="M46 16 C 48 18, 48 22, 44 26 L29 39 C 26 41, 23 41, 21 39 L17 35 C 15 33, 16 30, 18 28 L37 16 C 41 13, 44 14, 46 16 Z" fill="url(#pt-plane)" stroke="#0F172A" stroke-width="1.5" stroke-linejoin="round"/>
    <!-- Cockpit Window -->
    <path d="M41 18 C 43 19, 44 21, 42 22 L39 23 C 38 22, 38 20, 39 19 Z" fill="#0284C7"/>
    <ellipse cx="40.5" cy="19.5" rx="1.5" ry="0.8" fill="#BAE6FD"/>
    <!-- Main Wings -->
    <path d="M30 25 L38 39 C 39 40, 38 42, 36 42 L31 41 L25 32 Z" fill="url(#pt-wing)" stroke="#0F172A" stroke-width="1.3" stroke-linejoin="round"/>
    <!-- Top Wing -->
    <path d="M34 19 L40 7 C 41 5, 43 6, 43 7 L40 16 Z" fill="url(#pt-wing)" stroke="#0F172A" stroke-width="1.3" stroke-linejoin="round"/>
    <!-- Tail Fin -->
    <path d="M18 32 L15 22 C 14 21, 16 20, 17 21 L22 30 Z" fill="url(#pt-wing)" stroke="#0F172A" stroke-width="1.3" stroke-linejoin="round"/>
  </g>
  <!-- Puffy Clouds -->
  <g fill="#FFFFFF" opacity="0.95">
    <path d="M14 54 C 14 50, 18 47, 22 48 C 24 45, 29 45, 31 48 C 34 47, 38 49, 38 52 C 38 55, 35 57, 32 57 L16 57 C 14 57, 14 55, 14 54 Z"/>
    <path d="M38 53 C 38 50, 41 48, 44 49 C 46 47, 50 47, 52 49 C 54 48, 57 50, 57 53 C 57 55, 55 57, 53 57 L40 57 C 38 57, 38 55, 38 53 Z" opacity="0.9"/>
  </g>
  <!-- Sparkle Stars -->
  <path d="M48 10 L49 13 L52 14 L49 15 L48 18 L47 15 L44 14 L47 13 Z" fill="#FDE047"/>
  <path d="M14 24 L15 26 L17 27 L15 28 L14 30 L13 28 L11 27 L13 26 Z" fill="#FDE047"/>
  <circle cx="53" cy="24" r="1.5" fill="#FEF08A"/>
</svg>\n