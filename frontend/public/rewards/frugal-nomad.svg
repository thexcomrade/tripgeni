<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="fn-bg" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#B45309"/>
    </linearGradient>
    <linearGradient id="fn-pouch" x1="20" y1="20" x2="44" y2="52" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FDE047"/>
      <stop offset="50%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
    <linearGradient id="fn-coin" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FEF08A"/>
      <stop offset="100%" stop-color="#EAB308"/>
    </linearGradient>
    <filter id="fn-glow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#B45309" flood-opacity="0.4"/>
    </filter>
  </defs>
  <!-- Background Badge -->
  <circle cx="32" cy="32" r="30" fill="url(#fn-bg)" filter="url(#fn-glow)"/>
  <circle cx="32" cy="32" r="27.5" stroke="#FDE68A" stroke-width="1.5" opacity="0.6"/>
  <!-- Money Pouch Body -->
  <path d="M22 28 C 16 34, 16 48, 22 52 C 28 55, 36 55, 42 52 C 48 48, 48 34, 42 28 C 38 29, 26 29, 22 28 Z" fill="url(#fn-pouch)" stroke="#0F172A" stroke-width="1.5" stroke-linejoin="round"/>
  <!-- Tie Ribbon -->
  <path d="M24 28 C 28 30, 36 30, 40 28" stroke="#EF4444" stroke-width="3" stroke-linecap="round"/>
  <ellipse cx="32" cy="28" rx="2" ry="2" fill="#DC2626"/>
  <!-- Pouch Top Frill -->
  <path d="M22 28 C 21 23, 24 20, 27 21 C 29 20, 31 18, 33 21 C 36 19, 39 21, 40 23 C 42 25, 42 28, 40 28 Z" fill="#FBBF24" stroke="#0F172A" stroke-width="1.3"/>
  <!-- Rupee Symbol on Pouch -->
  <text x="32" y="44" font-family="Arial, sans-serif" font-size="13" font-weight="900" fill="#78350F" text-anchor="middle">₹</text>
  <!-- Spilling Gold Coins -->
  <g stroke="#0F172A" stroke-width="1.2">
    <!-- Coin 1 (left) -->
    <ellipse cx="18" cy="48" rx="6" ry="4" fill="url(#fn-coin)" transform="rotate(-15 18 48)"/>
    <!-- Coin 2 (right) -->
    <ellipse cx="46" cy="49" rx="6" ry="4.5" fill="url(#fn-coin)" transform="rotate(18 46 49)"/>
    <!-- Coin 3 (top floating) -->
    <ellipse cx="44" cy="20" rx="5" ry="3.5" fill="url(#fn-coin)" transform="rotate(-25 44 20)"/>
  </g>
  <!-- Sparkles -->
  <path d="M16 22 L17 24 L19 25 L17 26 L16 28 L15 26 L13 25 L15 24 Z" fill="#FFFFFF"/>
  <path d="M48 34 L49 36 L51 37 L49 38 L48 40 L47 38 L45 37 L47 36 Z" fill="#FEF08A"/>
</svg>\n