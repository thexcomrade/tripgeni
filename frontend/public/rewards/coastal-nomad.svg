<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="cn-bg" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="60%" stop-color="#0284C7"/>
      <stop offset="100%" stop-color="#0F766E"/>
    </linearGradient>
    <linearGradient id="cn-sun" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FDE047"/>
      <stop offset="100%" stop-color="#FB923C"/>
    </linearGradient>
    <linearGradient id="cn-wave" x1="16" y1="36" x2="48" y2="52" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#67E8F9"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>
    <filter id="cn-glow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#0284C7" flood-opacity="0.4"/>
    </filter>
  </defs>
  <!-- Background Badge -->
  <circle cx="32" cy="32" r="30" fill="url(#cn-bg)" filter="url(#cn-glow)"/>
  <circle cx="32" cy="32" r="27.5" stroke="#BAE6FD" stroke-width="1.5" opacity="0.6"/>
  <!-- Golden Tropical Sun -->
  <circle cx="44" cy="20" r="9" fill="url(#cn-sun)"/>
  <!-- Leaning Coconut Palm -->
  <path d="M14 52 C 16 38, 22 28, 28 22" stroke="#78350F" stroke-width="3" stroke-linecap="round"/>
  <!-- Palm Fronds (Leaves) -->
  <g fill="#10B981" stroke="#0F172A" stroke-width="0.8">
    <path d="M28 22 C 22 16, 12 18, 14 24 C 20 24, 25 23, 28 22 Z"/>
    <path d="M28 22 C 24 14, 30 8, 33 13 C 33 18, 30 20, 28 22 Z"/>
    <path d="M28 22 C 34 16, 42 18, 41 24 C 36 24, 31 23, 28 22 Z"/>
  </g>
  <!-- Coconuts -->
  <circle cx="27" cy="23" r="1.5" fill="#451A03"/>
  <circle cx="29" cy="24" r="1.5" fill="#451A03"/>
  <!-- Curling Ocean Wave -->
  <path d="M10 52 C 16 46, 26 44, 34 44 C 44 44, 48 38, 46 34 C 42 32, 38 36, 42 40 C 34 40, 26 44, 18 52 Z" fill="url(#cn-wave)" stroke="#0F172A" stroke-width="1.3"/>
  <!-- Wave White Foam -->
  <path d="M46 34 C 48 36, 46 38, 44 38" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round"/>
  <!-- Sandy Beach Dune at Bottom -->
  <path d="M8 54 C 18 50, 36 50, 56 54 Z" fill="#FDE68A" stroke="#0F172A" stroke-width="1.2"/>
  <!-- Sparkles -->
  <path d="M48 10 L49 12 L51 13 L49 14 L48 16 L47 14 L45 13 L47 12 Z" fill="#FEF08A"/>
</svg>\n