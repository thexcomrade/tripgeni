<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="gh-bg" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1E3A8A"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="gh-stone" x1="20" y1="18" x2="44" y2="48" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#CBD5E1"/>
    </linearGradient>
    <linearGradient id="gh-gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FDE047"/>
      <stop offset="100%" stop-color="#EAB308"/>
    </linearGradient>
    <filter id="gh-glow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#1E3A8A" flood-opacity="0.5"/>
    </filter>
  </defs>
  <!-- Background Badge -->
  <circle cx="32" cy="32" r="30" fill="url(#gh-bg)" filter="url(#gh-glow)"/>
  <circle cx="32" cy="32" r="27.5" stroke="#93C5FD" stroke-width="1.5" opacity="0.4"/>
  <!-- UNESCO Laurel Wreath -->
  <path d="M12 36 C 12 46, 20 52, 32 52 C 44 52, 52 46, 52 36" stroke="url(#gh-gold)" stroke-width="2" stroke-linecap="round" fill="none"/>
  <circle cx="12" cy="36" r="1.5" fill="#FDE047"/>
  <circle cx="52" cy="36" r="1.5" fill="#FDE047"/>
  <!-- Base Steps -->
  <rect x="14" y="44" width="36" height="4" rx="1" fill="url(#gh-stone)" stroke="#0F172A" stroke-width="1.2"/>
  <rect x="16" y="41" width="32" height="3" fill="#E2E8F0" stroke="#0F172A" stroke-width="1.2"/>
  <!-- Classical Pillars (4 pillars) -->
  <g fill="url(#gh-stone)" stroke="#0F172A" stroke-width="1.2">
    <rect x="19" y="26" width="4.5" height="15" rx="1"/>
    <rect x="26.5" y="26" width="4.5" height="15" rx="1"/>
    <rect x="33" y="26" width="4.5" height="15" rx="1"/>
    <rect x="40.5" y="26" width="4.5" height="15" rx="1"/>
  </g>
  <!-- Architrave / Lintel -->
  <rect x="16" y="23" width="32" height="3.5" fill="url(#gh-stone)" stroke="#0F172A" stroke-width="1.2"/>
  <!-- Triangular Pediment -->
  <path d="M15 23 L32 12 L49 23 Z" fill="url(#gh-stone)" stroke="#0F172A" stroke-width="1.4" stroke-linejoin="round"/>
  <!-- Medallion Center in Pediment -->
  <circle cx="32" cy="19" r="2" fill="url(#gh-gold)" stroke="#0F172A" stroke-width="0.8"/>
  <!-- Sparkles -->
  <path d="M32 6 L33 9 L36 10 L33 11 L32 14 L31 11 L28 10 L31 9 Z" fill="#FDE047"/>
</svg>\n