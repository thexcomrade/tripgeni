<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="sw-bg" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#D97706"/>
      <stop offset="100%" stop-color="#451A03"/>
    </linearGradient>
    <linearGradient id="sw-pack" x1="20" y1="20" x2="44" y2="52" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0D9488"/>
      <stop offset="50%" stop-color="#0F766E"/>
      <stop offset="100%" stop-color="#115E59"/>
    </linearGradient>
    <linearGradient id="sw-mat" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F97316"/>
      <stop offset="100%" stop-color="#EA580C"/>
    </linearGradient>
    <filter id="sw-glow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#451A03" flood-opacity="0.4"/>
    </filter>
  </defs>
  <!-- Background Badge -->
  <circle cx="32" cy="32" r="30" fill="url(#sw-bg)" filter="url(#sw-glow)"/>
  <circle cx="32" cy="32" r="27.5" stroke="#FBBF24" stroke-width="1.5" opacity="0.5"/>
  <!-- Rolled Bedroll / Mat on Top -->
  <rect x="20" y="14" width="24" height="7" rx="3.5" fill="url(#sw-mat)" stroke="#0F172A" stroke-width="1.3"/>
  <line x1="26" y1="14" x2="26" y2="21" stroke="#0F172A" stroke-width="1.2"/>
  <line x1="38" y1="14" x2="38" y2="21" stroke="#0F172A" stroke-width="1.2"/>
  <!-- Main Backpack Body -->
  <rect x="19" y="21" width="26" height="28" rx="7" fill="url(#sw-pack)" stroke="#0F172A" stroke-width="1.5"/>
  <!-- Front Outer Pocket -->
  <rect x="23" y="32" width="18" height="13" rx="3.5" fill="#14B8A6" stroke="#0F172A" stroke-width="1.2"/>
  <line x1="23" y1="36" x2="41" y2="36" stroke="#0F172A" stroke-width="1"/>
  <!-- Top Flap -->
  <path d="M20 22 C 20 22, 24 28, 32 28 C 40 28, 44 22, 44 22 Z" fill="#134E4A" stroke="#0F172A" stroke-width="1.2"/>
  <!-- Side Water Bottle / Canteen -->
  <rect x="15" y="30" width="4.5" height="12" rx="2" fill="#E2E8F0" stroke="#0F172A" stroke-width="1"/>
  <rect x="16" y="28" width="2.5" height="2" fill="#0284C7"/>
  <!-- Side Trekking Pole Clip -->
  <line x1="46" y1="24" x2="49" y2="46" stroke="#F59E0B" stroke-width="1.8" stroke-linecap="round"/>
  <!-- Compass Charm Tag -->
  <circle cx="28" cy="40" r="3" fill="#FEF08A" stroke="#0F172A" stroke-width="0.8"/>
  <path d="M28 38 L29 40 L28 42 L27 40 Z" fill="#EF4444"/>
  <!-- Sparkles -->
  <path d="M48 12 L49 14 L51 15 L49 16 L48 18 L47 16 L45 15 L47 14 Z" fill="#FDE047"/>
</svg>\n