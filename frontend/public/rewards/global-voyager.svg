<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="gv-bg" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1E1B4B"/>
      <stop offset="50%" stop-color="#1E3A8A"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>
    <linearGradient id="gv-ocean" x1="16" y1="16" x2="48" y2="48" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#0369A1"/>
    </linearGradient>
    <linearGradient id="gv-land" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4ADE80"/>
      <stop offset="100%" stop-color="#15803D"/>
    </linearGradient>
    <filter id="gv-glow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#0284C7" flood-opacity="0.5"/>
    </filter>
  </defs>
  <!-- Background Badge -->
  <circle cx="32" cy="32" r="30" fill="url(#gv-bg)" filter="url(#gv-glow)"/>
  <circle cx="32" cy="32" r="27.5" stroke="#38BDF8" stroke-width="1.5" opacity="0.4"/>
  <!-- Globe Sphere -->
  <circle cx="32" cy="32" r="18" fill="url(#gv-ocean)" stroke="#0F172A" stroke-width="1.5"/>
  <!-- Globe Continents (Stylized Cartoon) -->
  <g fill="url(#gv-land)" stroke="#0F172A" stroke-width="0.8">
    <path d="M26 18 C 28 16, 34 16, 36 20 C 38 24, 34 26, 30 24 Z"/>
    <path d="M20 28 C 22 25, 27 26, 28 30 C 26 34, 21 34, 20 28 Z"/>
    <path d="M34 28 C 38 27, 44 30, 42 36 C 38 38, 34 34, 34 28 Z"/>
    <path d="M24 38 C 27 36, 32 38, 30 44 C 26 46, 23 42, 24 38 Z"/>
  </g>
  <!-- Longitude / Latitude Shading Ring -->
  <ellipse cx="32" cy="32" rx="18" ry="7" stroke="#BAE6FD" stroke-width="0.8" opacity="0.4" fill="none"/>
  <!-- Airplane Orbital Trajectory Ring -->
  <ellipse cx="32" cy="32" rx="24" ry="11" transform="rotate(-30 32 32)" stroke="#FDE047" stroke-width="1.5" stroke-dasharray="4 3"/>
  <!-- Mini Cartoon Airplane in Orbit -->
  <g transform="translate(44, 16) rotate(35)">
    <path d="M0 0 L6 -2 L8 0 L6 2 Z" fill="#FFFFFF" stroke="#0F172A" stroke-width="0.8"/>
    <polygon points="2,0 0,5 3,5" fill="#EF4444"/>
    <polygon points="2,0 0,-5 3,-5" fill="#EF4444"/>
  </g>
  <!-- Red Destination Marker Pin -->
  <g transform="translate(30, 20)">
    <path d="M4 0 C 1.8 0, 0 1.8, 0 4 C 0 7, 4 11, 4 11 C 4 11, 8 7, 8 4 C 8 1.8, 6.2 0, 4 0 Z" fill="#EF4444" stroke="#0F172A" stroke-width="0.8"/>
    <circle cx="4" cy="4" r="1.5" fill="#FFFFFF"/>
  </g>
  <!-- Sparkles -->
  <path d="M12 12 L13 14 L15 15 L13 16 L12 18 L11 16 L9 15 L11 14 Z" fill="#FEF08A"/>
</svg>\n