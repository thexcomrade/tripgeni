<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="gp2-bg" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#F43F5E"/>
      <stop offset="50%" stop-color="#FB923C"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>
    <linearGradient id="gp2-boat" x1="16" y1="36" x2="48" y2="48" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#B45309"/>
      <stop offset="100%" stop-color="#78350F"/>
    </linearGradient>
    <linearGradient id="gp2-sun" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FEF08A"/>
      <stop offset="100%" stop-color="#F97316"/>
    </linearGradient>
    <filter id="gp2-glow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#0284C7" flood-opacity="0.4"/>
    </filter>
  </defs>
  <!-- Background Badge -->
  <circle cx="32" cy="32" r="30" fill="url(#gp2-bg)" filter="url(#gp2-glow)"/>
  <circle cx="32" cy="32" r="27.5" stroke="#FED7AA" stroke-width="1.5" opacity="0.6"/>
  <!-- Sacred Dawn Sun -->
  <circle cx="32" cy="24" r="10" fill="url(#gp2-sun)"/>
  <path d="M32 10 L32 12 M32 36 L32 38 M18 24 L20 24 M44 24 L46 24" stroke="#FEF08A" stroke-width="1.5" stroke-linecap="round"/>
  <!-- River Water Waves -->
  <path d="M4 42 C 12 40, 20 44, 28 42 C 36 40, 44 44, 52 42 C 56 41, 60 42, 60 42" stroke="#38BDF8" stroke-width="2" stroke-linecap="round"/>
  <path d="M6 48 C 14 46, 22 50, 30 48 C 38 46, 46 50, 54 48 C 58 47, 60 48, 60 48" stroke="#0284C7" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Wooden Rowboat -->
  <path d="M14 40 L18 47 C 22 49, 42 49, 46 47 L50 40 C 46 42, 18 42, 14 40 Z" fill="url(#gp2-boat)" stroke="#0F172A" stroke-width="1.3" stroke-linejoin="round"/>
  <path d="M20 42 L44 42" stroke="#D97706" stroke-width="1"/>
  <!-- Crossed Oar -->
  <path d="M22 34 L38 48" stroke="#D97706" stroke-width="1.5" stroke-linecap="round"/>
  <ellipse cx="38" cy="48" rx="2" ry="3.5" transform="rotate(-40 38 48)" fill="#B45309" stroke="#0F172A" stroke-width="0.8"/>
  <!-- Floating Diya (Flower Lamp with Flame) -->
  <ellipse cx="22" cy="49" rx="3" ry="1.5" fill="#F59E0B"/>
  <path d="M22 49 C 21 47, 23 45, 22 44 C 22 45, 24 47, 22 49 Z" fill="#EF4444"/>
  <!-- Sparkles -->
  <path d="M48 14 L49 16 L51 17 L49 18 L48 20 L47 18 L45 17 L47 16 Z" fill="#FEF08A"/>
</svg>\n