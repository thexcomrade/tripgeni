<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="hs-bg" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#EA580C"/>
      <stop offset="100%" stop-color="#9A3412"/>
    </linearGradient>
    <linearGradient id="hs-stone" x1="20" y1="16" x2="44" y2="52" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FED7AA"/>
      <stop offset="50%" stop-color="#FB923C"/>
      <stop offset="100%" stop-color="#C2410C"/>
    </linearGradient>
    <linearGradient id="hs-gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FEF08A"/>
      <stop offset="100%" stop-color="#EAB308"/>
    </linearGradient>
    <filter id="hs-glow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#9A3412" flood-opacity="0.4"/>
    </filter>
  </defs>
  <!-- Background Badge -->
  <circle cx="32" cy="32" r="30" fill="url(#hs-bg)" filter="url(#hs-glow)"/>
  <circle cx="32" cy="32" r="27.5" stroke="#FDBA74" stroke-width="1.5" opacity="0.5"/>
  <!-- Temple Base Plinth -->
  <rect x="14" y="48" width="36" height="5" rx="1.5" fill="#7C2D12" stroke="#0F172A" stroke-width="1.2"/>
  <rect x="17" y="44" width="30" height="4" fill="#9A3412" stroke="#0F172A" stroke-width="1.2"/>
  <!-- Main Mandapa Pillars -->
  <rect x="20" y="34" width="24" height="10" fill="url(#hs-stone)" stroke="#0F172A" stroke-width="1.2"/>
  <!-- Sanctum Arch Doorway -->
  <path d="M29 44 L29 37 C 29 35, 35 35, 35 37 L35 44 Z" fill="#431407"/>
  <circle cx="32" cy="38" r="1.5" fill="#FEF08A"/>
  <!-- Tier 2 Gopuram Tower -->
  <path d="M22 34 L24 26 L40 26 L42 34 Z" fill="url(#hs-stone)" stroke="#0F172A" stroke-width="1.2"/>
  <!-- Tier 3 Gopuram Tower -->
  <path d="M25 26 L27 18 L37 18 L39 26 Z" fill="url(#hs-stone)" stroke="#0F172A" stroke-width="1.2"/>
  <!-- Golden Kalash Spire / Pinnacle -->
  <path d="M30 18 L32 10 L34 18 Z" fill="url(#hs-gold)" stroke="#0F172A" stroke-width="1"/>
  <circle cx="32" cy="9" r="2" fill="#FEF08A" stroke="#0F172A" stroke-width="0.8"/>
  <!-- Flying Ceremonial Flags -->
  <path d="M34 11 L40 13 L34 15 Z" fill="#EF4444"/>
  <!-- Incense Smoke Swirls -->
  <path d="M15 36 C 13 32, 17 28, 15 24" stroke="#FED7AA" stroke-width="1.2" stroke-linecap="round" opacity="0.6"/>
  <path d="M49 36 C 51 32, 47 28, 49 24" stroke="#FED7AA" stroke-width="1.2" stroke-linecap="round" opacity="0.6"/>
  <!-- Sparkles -->
  <path d="M48 14 L49 16 L51 17 L49 18 L48 20 L47 18 L45 17 L47 16 Z" fill="#FEF08A"/>
  <path d="M16 16 L17 18 L19 19 L17 20 L16 22 L15 20 L13 19 L15 18 Z" fill="#FEF08A"/>
</svg>\n