<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="wg-bg" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0284C7"/>
      <stop offset="50%" stop-color="#0F766E"/>
      <stop offset="100%" stop-color="#064E3B"/>
    </linearGradient>
    <linearGradient id="wg-sun" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FDE047"/>
      <stop offset="100%" stop-color="#F97316"/>
    </linearGradient>
    <linearGradient id="wg-peak-back" x1="16" y1="20" x2="40" y2="44">
      <stop offset="0%" stop-color="#64748B"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>
    <linearGradient id="wg-peak-front" x1="20" y1="26" x2="52" y2="52">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#065F46"/>
    </linearGradient>
    <filter id="wg-glow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#064E3B" flood-opacity="0.4"/>
    </filter>
  </defs>
  <!-- Background Badge -->
  <circle cx="32" cy="32" r="30" fill="url(#wg-bg)" filter="url(#wg-glow)"/>
  <circle cx="32" cy="32" r="27.5" stroke="#38BDF8" stroke-width="1.5" opacity="0.4"/>
  <!-- Morning Sun -->
  <circle cx="24" cy="22" r="9" fill="url(#wg-sun)"/>
  <!-- Back Misty Mountain -->
  <path d="M12 48 L26 22 C 27 20, 30 20, 31 22 L45 48 Z" fill="url(#wg-peak-back)" stroke="#0F172A" stroke-width="1.3"/>
  <path d="M26 22 L28 26 L30 24 L31 22 L30 20 L27 20 Z" fill="#F8FAFC"/>
  <!-- Front Rolling Green Shola Peak -->
  <path d="M22 52 L36 28 C 37 26, 40 26, 41 28 L56 52 Z" fill="url(#wg-peak-front)" stroke="#0F172A" stroke-width="1.3"/>
  <!-- Tea Plantation Ridge Highlights -->
  <path d="M30 42 C 34 38, 40 38, 46 43" stroke="#6EE7B7" stroke-width="1.5" stroke-linecap="round" opacity="0.7"/>
  <path d="M26 47 C 32 44, 42 44, 50 48" stroke="#6EE7B7" stroke-width="1.5" stroke-linecap="round" opacity="0.7"/>
  <!-- Pine / Conifer Trees -->
  <g fill="#064E3B" stroke="#0F172A" stroke-width="0.8">
    <path d="M15 50 L17 44 L19 50 Z"/>
    <path d="M18 52 L21 43 L24 52 Z"/>
    <path d="M48 53 L51 45 L54 53 Z"/>
  </g>
  <!-- Misty Cloud Base -->
  <path d="M8 52 C 12 48, 18 49, 22 51 C 28 48, 36 49, 42 51 C 48 48, 54 49, 58 53 L8 53 Z" fill="#E2E8F0" opacity="0.85"/>
  <!-- Flying Birds -->
  <path d="M42 16 Q 44 14 46 16 Q 48 14 50 16" stroke="#FFFFFF" stroke-width="1" stroke-linecap="round" fill="none"/>
  <path d="M46 20 Q 48 18 50 20 Q 52 18 54 20" stroke="#FFFFFF" stroke-width="0.9" stroke-linecap="round" fill="none"/>
</svg>\n