<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="cr-bg" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
    <linearGradient id="cr-train" x1="18" y1="18" x2="46" y2="46" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#CBD5E1"/>
    </linearGradient>
    <linearGradient id="cr-stripe" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#06B6D4"/>
    </linearGradient>
    <filter id="cr-glow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#047857" flood-opacity="0.4"/>
    </filter>
  </defs>
  <!-- Background Badge -->
  <circle cx="32" cy="32" r="30" fill="url(#cr-bg)" filter="url(#cr-glow)"/>
  <circle cx="32" cy="32" r="27.5" stroke="#6EE7B7" stroke-width="1.5" opacity="0.5"/>
  <!-- Train Tracks -->
  <path d="M10 50 L54 50" stroke="#334155" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M14 47 L14 53 M22 47 L22 53 M30 47 L30 53 M38 47 L38 53 M46 47 L46 53 M52 47 L52 53" stroke="#64748B" stroke-width="1.8"/>
  <!-- Electric Bullet Train Front -->
  <path d="M16 46 L16 32 C 16 22, 24 16, 32 16 C 40 16, 48 22, 48 32 L48 46 Z" fill="url(#cr-train)" stroke="#0F172A" stroke-width="1.5"/>
  <!-- Aerodynamic Windshield -->
  <path d="M20 28 C 20 23, 25 20, 32 20 C 39 20, 44 23, 44 28 L42 33 C 38 34, 26 34, 22 33 Z" fill="#0284C7" stroke="#0F172A" stroke-width="1.2"/>
  <path d="M23 25 C 26 23, 30 22, 33 22" stroke="#BAE6FD" stroke-width="1.2" stroke-linecap="round"/>
  <!-- Green Eco Stripe -->
  <path d="M16 37 L48 37 L48 41 L16 41 Z" fill="url(#cr-stripe)"/>
  <!-- Headlights -->
  <circle cx="22" cy="43" r="2" fill="#FEF08A" stroke="#0F172A" stroke-width="0.8"/>
  <circle cx="42" cy="43" r="2" fill="#FEF08A" stroke="#0F172A" stroke-width="0.8"/>
  <!-- Swirling Green Leaves (Clean Energy) -->
  <g fill="#86EFAC" stroke="#065F46" stroke-width="0.8">
    <path d="M12 24 C 8 22, 9 17, 13 18 C 16 21, 14 24, 12 24 Z"/>
    <path d="M50 20 C 54 18, 55 23, 51 24 C 48 23, 48 20, 50 20 Z"/>
    <path d="M10 38 C 7 36, 8 32, 11 34 C 13 36, 12 39, 10 38 Z"/>
  </g>
  <!-- Sparkles -->
  <path d="M32 9 L33 11 L35 12 L33 13 L32 15 L31 13 L29 12 L31 11 Z" fill="#FEF08A"/>
</svg>\n