<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="wfc-bg" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0284C7"/>
      <stop offset="60%" stop-color="#0EA5E9"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="wfc-water" x1="26" y1="18" x2="38" y2="48" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#E0F2FE"/>
      <stop offset="50%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>
    <filter id="wfc-glow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#059669" flood-opacity="0.4"/>
    </filter>
  </defs>
  <!-- Background Badge -->
  <circle cx="32" cy="32" r="30" fill="url(#wfc-bg)" filter="url(#wfc-glow)"/>
  <circle cx="32" cy="32" r="27.5" stroke="#7DD3FC" stroke-width="1.5" opacity="0.6"/>
  <!-- Rainbow Arc -->
  <path d="M16 32 C 16 20, 48 20, 48 32" stroke="#F43F5E" stroke-width="1.2" opacity="0.6" stroke-linecap="round"/>
  <path d="M18 33 C 18 23, 46 23, 46 33" stroke="#FDE047" stroke-width="1.2" opacity="0.6" stroke-linecap="round"/>
  <path d="M20 34 C 20 25, 44 25, 44 34" stroke="#34D399" stroke-width="1.2" opacity="0.6" stroke-linecap="round"/>
  <!-- Left Mountain Cliff -->
  <path d="M6 34 L26 22 L26 54 L6 54 Z" fill="#334155" stroke="#0F172A" stroke-width="1.3"/>
  <path d="M12 28 C 16 26, 20 28, 22 25" stroke="#10B981" stroke-width="2" stroke-linecap="round"/>
  <!-- Right Mountain Cliff -->
  <path d="M38 22 L58 34 L58 54 L38 54 Z" fill="#334155" stroke="#0F172A" stroke-width="1.3"/>
  <path d="M42 25 C 46 27, 50 26, 54 29" stroke="#10B981" stroke-width="2" stroke-linecap="round"/>
  <!-- Cascading Waterfall Streams -->
  <path d="M26 22 C 28 24, 36 24, 38 22 L37 48 C 35 50, 29 50, 27 48 Z" fill="url(#wfc-water)" stroke="#0F172A" stroke-width="1.2"/>
  <path d="M29 24 L29 46 M32 23 L32 47 M35 24 L35 46" stroke="#FFFFFF" stroke-width="1" stroke-linecap="round" opacity="0.8"/>
  <!-- Splash Foam & Mist at Base -->
  <ellipse cx="32" cy="49" rx="12" ry="4" fill="#E0F2FE" stroke="#0F172A" stroke-width="1"/>
  <circle cx="24" cy="47" r="2" fill="#FFFFFF"/>
  <circle cx="40" cy="47" r="2.2" fill="#FFFFFF"/>
  <circle cx="32" cy="46" r="2.5" fill="#FFFFFF"/>
  <!-- Water Droplets Flying -->
  <circle cx="22" cy="42" r="1.2" fill="#BAE6FD"/>
  <circle cx="42" cy="40" r="1.4" fill="#BAE6FD"/>
  <circle cx="30" cy="38" r="1" fill="#FFFFFF"/>
</svg>\n